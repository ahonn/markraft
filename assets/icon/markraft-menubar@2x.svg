<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <title>Markraft parallel-cut M, menu bar template at 2x</title>
  <!-- One unit is one pixel on a Retina display; the same 18-point canvas as
       markraft-menubar.svg. The glyph is 36 x 28 with 10-unit stems, every
       straight edge on the grid. Slit edges keep slope 1, y=x-10 and y=x-14: four
       units across, against the 3.4 a plain reduction of markraft-m.svg would give.
       Only alpha is used: macOS tints a template image itself. -->
  <path fill="#000" transform="translate(0 4)" d="M 1 0 H 10 L 24 14 L 18.5 19.5 Q 18 20 17.5 19.5 L 10 12 V 27 Q 10 28 9 28 H 1 Q 0 28 0 27 V 1 Q 0 0 1 0 Z
M 24 0 H 35 Q 36 0 36 1 V 27 Q 36 28 35 28 H 27 Q 26 28 26 27 V 12 L 19 5 Z"/>
</svg>
