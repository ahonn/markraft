<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <title>Markraft parallel-cut M, menu bar template at 1x</title>
  <!-- One unit is one pixel on a non-Retina display. The glyph is 16 x 12 with
       4-unit stems, every straight edge on the grid. Slit edges keep slope 1,
       y=x-4 and y=x-7: three units across, so two whole pixels stay clear in each
       row. A plain reduction of markraft-m.svg leaves 1.4 and fills in.
       Only alpha is used: macOS tints a template image itself. -->
  <path fill="#000" transform="translate(1 3)" d="M .5 0 H 4 L 10.5 6.5 L 8.25 8.75 Q 8 9 7.75 8.75 L 4 5 V 11.5 Q 4 12 3.5 12 H .5 Q 0 12 0 11.5 V .5 Q 0 0 .5 0 Z
M 11 0 H 15.5 Q 16 0 16 .5 V 11.5 Q 16 12 15.5 12 H 12.5 Q 12 12 12 11.5 V 5 L 9 2 Z"/>
</svg>
