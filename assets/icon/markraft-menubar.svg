<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <title>Markraft parallel-cut M, menu bar template at 1x</title>
  <!-- One unit is one pixel on a non-Retina display. The glyph is 15 x 12 with
       4-unit stems, every straight edge on the grid; an odd width cannot be
       centered on it, so the glyph sits one unit from the left edge and two from
       the right. Slit edges keep slope 1, y=x-4 and y=x-7: three units across, so
       two whole pixels stay clear in each row. A plain reduction of
       markraft-m.svg leaves 1.4 and fills in.
       Only alpha is used: macOS tints a template image itself. -->
  <path fill="#000" transform="translate(1 3)" d="M .5 0 H 4 L 10 6 L 7.75 8.25 Q 7.5 8.5 7.25 8.25 L 4 5 V 11.5 Q 4 12 3.5 12 H .5 Q 0 12 0 11.5 V .5 Q 0 0 .5 0 Z
M 10 0 H 14.5 Q 15 0 15 .5 V 11.5 Q 15 12 14.5 12 H 11.5 Q 11 12 11 11.5 V 4 L 8.5 1.5 Z"/>
</svg>
