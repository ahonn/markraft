<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <title>Markraft parallel-cut M, menu bar template at 2x</title>
  <!-- One unit is one pixel on a Retina display; the same 18-point canvas as
       markraft-menubar.svg. The glyph is 30 x 24 with 8-unit stems, every straight
       edge on the grid. Slit edges keep slope 1, y=x-8 and y=x-12: four units
       across, against the 2.9 a plain reduction of markraft-m.svg would give.
       Only alpha is used: macOS tints a template image itself. -->
  <path fill="#000" transform="translate(3 6)" d="M 1 0 H 8 L 20 12 L 15.5 16.5 Q 15 17 14.5 16.5 L 8 10 V 23 Q 8 24 7 24 H 1 Q 0 24 0 23 V 1 Q 0 0 1 0 Z
M 20 0 H 29 Q 30 0 30 1 V 23 Q 30 24 29 24 H 23 Q 22 24 22 23 V 10 L 16 4 Z"/>
</svg>
