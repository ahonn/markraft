[package]
name = "markraft-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native GPUI editor view for markraft-core"
repository.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
gpui.workspace = true
markraft-core.workspace = true
markraft-math.workspace = true
markraft-media.workspace = true
unicode-segmentation = "1.12"
serde_json = "1"
markraft-syntax.workspace = true
emojis = "0.9"
url = "2"
# gpui decodes images with the same crate; these formats are the animated ones.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png"] }

[dev-dependencies]
markraft-commonmark.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSTextView", "NSText", "NSView", "NSResponder", "NSAttributedString"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSCharacterSet", "NSString", "NSArray", "NSAttributedString"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
