[package]
name = "markraft-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native GPUI editor view for markraft-core"
repository.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
markraft-core.workspace = true
unicode-segmentation = "1.12"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSArray"] }
