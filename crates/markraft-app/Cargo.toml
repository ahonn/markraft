[package]
name = "markraft-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Floating macOS notepad built on the Markraft editor"
repository.workspace = true
license.workspace = true

[features]
default = ["direct-distribution"]
direct-distribution = ["dep:sparkle-updater"]
mac-app-store = ["markraft-workspace/sandbox"]
# Local update integration tests use an isolated app identity and data directory.
updater-mock = ["direct-distribution"]

[dependencies]
markraft-notes = { path = "../markraft-notes", features = ["unstable-internals"] }
markraft-workspace = { path = "../markraft-workspace", features = ["unstable-standalone", "native-translation"] }
gpui.workspace = true
gpui_platform.workspace = true
markraft-gpui.workspace = true
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
notify = "8"
url = "2"

[dev-dependencies]
# Process integration tests; workspace behavior tests live in markraft-workspace.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
global-hotkey = "0.7"
tray-icon = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication", "NSAttributedString", "NSPasteboard", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSFontDescriptor",
    "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder",
    "NSStatusBarButton", "NSStatusItem", "NSView", "NSPrintInfo", "NSPrintOperation", "NSWindow",
    "NSBezierPath", "NSWritingToolsCoordinator", "NSWritingToolsCoordinatorContext", "NSWritingToolsCoordinatorAnimationParameters", "block2",
    "objc2-core-foundation",
] }
raw-window-handle = "0.6"
sparkle-updater = { version = "=0.1.0", optional = true }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSError", "NSString", "NSURL"] }

[package.metadata.bundle]
name = "Markraft"
identifier = "app.markraft.mac"
icon = ["target/Markraft.icns"]
category = "Productivity"
osx_minimum_system_version = "13.0"
osx_frameworks = ["target/sparkle/Sparkle.framework"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
