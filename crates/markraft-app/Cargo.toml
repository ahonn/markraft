[package]
name = "markraft-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Floating macOS notepad built on the Markraft editor"
repository.workspace = true
license.workspace = true

[features]
# Local update integration tests use an isolated app identity and data directory.
updater-mock = []

[dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui.workspace = true
gpui_platform.workspace = true
gpui-base.workspace = true
markraft-core.workspace = true
markraft-commonmark.workspace = true
markraft-gpui.workspace = true
markraft-vim.workspace = true
tempfile = "3"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = "8"
url = "2"
ureq = "3"

[dev-dependencies]
# The app's own flows run headless against GPUI's test platform; see src/e2e.rs.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
global-hotkey = "0.7"
tray-icon = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSFontDescriptor",
    "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder",
    "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation",
] }
raw-window-handle = "0.6"
sparkle-updater = "=0.1.0"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSString"] }

[package.metadata.bundle]
name = "Markraft"
identifier = "app.markraft.mac"
icon = ["target/Markraft.icns"]
category = "Productivity"
osx_minimum_system_version = "13.0"
osx_frameworks = ["target/sparkle/Sparkle.framework"]
