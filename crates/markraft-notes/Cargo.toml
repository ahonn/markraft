[package]
name = "markraft-notes"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Markdown notes, ordered persistence, and document sessions"

[features]
default = []
test-support = []
# Contract checks that a host runs against its own NotesBackend.
conformance = []

[dependencies]
markraft-core.workspace = true
markraft-commonmark.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
notify = "8"
rust-i18n = "4"
unicode-segmentation = "1.12"
tempfile = "3"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSFileManager", "NSString", "NSURL", "NSArray"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
