[package]
name = "markraft-commonmark"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CommonMark/GFM schema preset and Markdown codec for markraft-core"
repository.workspace = true
license.workspace = true

[dependencies]
markraft-core = { workspace = true }
comrak = { version = "0.55.0", default-features = false }
emojis = "0.9"
scraper = { version = "0.24", default-features = false }
finl_unicode = { version = "1.4.0", default-features = false, features = ["categories"] }
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_code = "forbid"
missing_docs = "warn"
