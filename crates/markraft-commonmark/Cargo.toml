[package]
name = "markraft-commonmark"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CommonMark/GFM schema preset and Markdown codec for markraft-core"
repository.workspace = true
license.workspace = true

[dependencies]
markraft-core = { workspace = true }
comrak = { version = "0.55.0", default-features = false }
scraper = { version = "0.24", default-features = false }
finl_unicode = { version = "1.4.0", default-features = false, features = ["categories"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
