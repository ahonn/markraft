name: CI
on:
  pull_request:
    paths-ignore: ['**.md', LICENSE, '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [master, main]
    paths-ignore: ['**.md', LICENSE, '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check; defaults to the triggering ref
        type: string
        default: ''
permissions:
  contents: read
# A called workflow sees its caller's github context, so the release's check would
# share a group with branch CI and a push to master would cancel the release. The
# release passes a ref; its check gets a group of its own and runs to the end.
concurrency:
  group: ci-${{ inputs.ref && format('release-{0}', inputs.ref) || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes non-Cargo files but can restore their empty directories.
      - name: Discard incomplete cached Sparkle installation
        run: rm -rf target/sparkle
      - run: bash scripts/download-sparkle.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
