name: CI
on:
  pull_request:
    paths-ignore: ['**.md', LICENSE, '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [master, main]
    paths-ignore: ['**.md', LICENSE, '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check; defaults to the triggering ref
        type: string
        default: ''
permissions:
  contents: read
# A called workflow sees its caller's github context, so the release's check would
# share a group with branch CI and a push to master would cancel the release. The
# release passes a ref; its check gets a group of its own and runs to the end.
concurrency:
  group: ci-${{ inputs.ref && format('release-{0}', inputs.ref) || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: python3 scripts/prepare-dependencies.py
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes non-Cargo files but can restore their empty directories.
      - name: Discard incomplete cached Sparkle installation
        run: rm -rf target/sparkle
      - run: bash scripts/download-sparkle.sh
      - run: cargo fmt --all -- --check
      - name: Test dependency preparation, Cloud hooks, and archive validation
        run: python3 -m unittest discover -s ci_scripts/tests -v
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check independent integration consumers
        run: sh examples/integration/check.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Compare the embeddable crates' public interface with the latest release
        run: sh scripts/check-public-api.sh
      - name: Check the Mac App Store channel
        run: cargo clippy -p markraft-app -p markraft-workspace --all-targets --no-default-features --features markraft-app/mac-app-store --locked -- -D warnings
      - name: Test the Mac App Store channel
        run: cargo test -p markraft-app -p markraft-workspace --no-default-features --features markraft-app/mac-app-store --locked
      - name: Verify Sparkle release notes generation
        run: cargo test -p xtask --locked sparkle_embeds_release_notes_in_generated_feed -- --ignored
