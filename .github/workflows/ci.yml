name: CI
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes non-Cargo files but can restore their empty directories.
      - name: Discard incomplete cached Sparkle installation
        run: rm -rf target/sparkle
      - run: bash scripts/download-sparkle.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p markraft-app --features updater-mock --locked updater::tests
