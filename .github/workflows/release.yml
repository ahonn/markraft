name: Release
on:
  # A pushed tag releases that commit as is.
  push:
    tags: ['v*']
  # Merging the release PR tags the merge commit and releases it.
  pull_request:
    types: [closed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'release' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          tag="v$version"
          # A tag created with the workflow token does not start another run.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$MERGE_SHA" ]; then
              echo "$tag already points at $existing" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$MERGE_SHA" > /dev/null
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
  # Each architecture builds on a machine of its own, alongside validate: only
  # publishing waits for the tests.
  compile:
    needs: tag
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      # No Rust cache: caches saved from a tag or pull request ref are never seen by
      # the next release, so every release compiles from scratch anyway.
      - run: cargo xtask compile --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/markraft-app
          if-no-files-found: error
          retention-days: 7
  package:
    needs: [tag, compile]
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      MARKRAFT_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Validate public distribution repository
        run: |
          test "$GITHUB_REPOSITORY" = 'ahonn/markraft'
          test "$(gh repo view --json visibility --jq .visibility)" = PUBLIC
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # A prebuilt binary; building it from source took minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle@0.11.0
      - uses: actions/download-artifact@v8
        with:
          name: binary-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@v8
        with:
          name: binary-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release
      # Artifacts do not keep the executable bit.
      - run: chmod +x target/*-apple-darwin/release/markraft-app
      - name: Set temporary credential paths
        run: |
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle-private-key" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/markraft-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Import signing credentials
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12}"
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY}"
          umask 077
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
      - name: Bundle, sign, notarize and generate appcast
        run: cargo xtask release "$TAG" --prebuilt
      - name: Verify embedded framework without development paths
        run: env -u DYLD_FRAMEWORK_PATH 'target/universal-apple-darwin/release/bundle/osx/Markraft.app/Contents/MacOS/markraft-app' --help
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: target/release-artifacts/
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$SPARKLE_PRIVATE_KEY_FILE"
  # Publishes the artifacts package made, so re-running it never rebuilds: a new
  # build would be signed and notarized anew and no longer match its appcast.
  publish:
    needs: [tag, package, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: target/release-artifacts
      - name: Publish all artifacts together
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$is_draft" != true ]; then
              echo 'Release is already published; do not overwrite it' >&2
              exit 1
            fi
          else
            # Prefer the CHANGELOG.md section written from change files.
            if bash scripts/changelog-section.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"; then
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --verify-tag --draft --title "Markraft $TAG" "${notes[@]}"
          fi
          # The same disk image under a name without the version, so
          # releases/latest/download/Markraft.dmg always serves the newest one.
          cp "target/release-artifacts/Markraft-${TAG#v}-universal.dmg" "$RUNNER_TEMP/Markraft.dmg"
          gh release upload "$TAG" "target/release-artifacts/Markraft-${TAG#v}-universal.dmg" "target/release-artifacts/Markraft-${TAG#v}-universal.zip" target/release-artifacts/appcast.xml target/release-artifacts/SHA256SUMS "$RUNNER_TEMP/Markraft.dmg" --clobber
          gh release edit "$TAG" --draft=false --latest
  # A separate job so "Re-run failed jobs" retries only the feed: rebuilding would
  # produce a different archive whose signature no longer matches the release.
  publish-feed:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      FEED_URL: https://updates.markraft.app/appcast.xml
      FEED_OBJECT: markraft-updates/appcast.xml
    steps:
      - name: Download the published appcast
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir feed
      - name: Refuse to replace a newer feed
        run: |
          set -euo pipefail
          version() { sed -n 's|.*<sparkle:version>\([^<]*\)</sparkle:version>.*|\1|p' "$1" | head -n 1; }
          new=$(version feed/appcast.xml)
          test -n "$new"
          status=$(curl -sS -o live.xml -w '%{http_code}' "$FEED_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-live")
          if [ "$status" = 404 ]; then
            echo "No feed published yet"
            exit 0
          fi
          test "$status" = 200
          live=$(version live.xml)
          if [ "$live" != "$new" ] && [ "$(printf '%s\n%s\n' "$live" "$new" | sort -V | tail -n 1)" = "$live" ]; then
            echo "Live feed advertises $live, newer than $new" >&2
            exit 1
          fi
      - name: Check the advertised archive is downloadable
        run: |
          set -euo pipefail
          url=$(sed -n 's|.*<enclosure url="\([^"]*\)".*|\1|p' feed/appcast.xml)
          test -n "$url"
          curl -fsSIL --retry 5 --retry-all-errors "$url" > /dev/null
      - name: Upload the appcast
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.141.0 r2 object put "$FEED_OBJECT" --remote \
            --file feed/appcast.xml \
            --content-type 'application/rss+xml; charset=utf-8' \
            --cache-control 'public, max-age=300'
      - name: Verify the served feed
        run: |
          curl -fsS "$FEED_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o served.xml
          cmp feed/appcast.xml served.xml
