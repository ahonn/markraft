[workspace]
resolver = "2"
members = [
    "crates/markraft-core",
    "crates/markraft-commonmark",
    "crates/markraft-math",
    "crates/markraft-media",
    "crates/markraft-syntax",
    "crates/markraft-gpui",
    "crates/markraft-vim",
    "crates/markraft-app",
    "xtask",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/ahonn/markraft"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders"] }
gpui-base = "=0.6.6"
markraft-core = { path = "crates/markraft-core" }
markraft-commonmark = { path = "crates/markraft-commonmark" }
markraft-math = { path = "crates/markraft-math" }
markraft-media = { path = "crates/markraft-media" }
markraft-syntax = { path = "crates/markraft-syntax" }
markraft-gpui = { path = "crates/markraft-gpui" }
markraft-vim = { path = "crates/markraft-vim" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

# Run python3 scripts/prepare-dependencies.py before Cargo. See patches/README.md.
[patch.crates-io]
gpui-pre-macos = { path = ".build/dependencies/gpui-pre-macos" }
