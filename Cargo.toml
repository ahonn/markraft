[workspace]
resolver = "2"
members = ["crates/markraft-core", "crates/markraft-gpui", "crates/markraft-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/ahonn/markraft"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit", "runtime_shaders"] }
markraft-core = { path = "crates/markraft-core" }
markraft-gpui = { path = "crates/markraft-gpui" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
