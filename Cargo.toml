[workspace]
resolver = "2"
members = [
    "crates/markraft-core",
    "crates/markraft-commonmark",
    "crates/markraft-math",
    "crates/markraft-media",
    "crates/markraft-syntax",
    "crates/markraft-gpui",
    "crates/markraft-vim",
    "crates/markraft-notes",
    "crates/markraft-workspace",
    "crates/markraft-app",
    "xtask",
]

[workspace.package]
version = "0.1.9"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/ahonn/markraft"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders"] }
gpui-base = "=0.6.6"
markraft-core = { path = "crates/markraft-core" }
markraft-commonmark = { path = "crates/markraft-commonmark" }
markraft-math = { path = "crates/markraft-math" }
markraft-media = { path = "crates/markraft-media" }
markraft-syntax = { path = "crates/markraft-syntax" }
markraft-gpui = { path = "crates/markraft-gpui" }
markraft-vim = { path = "crates/markraft-vim" }
markraft-notes = { path = "crates/markraft-notes" }
markraft-workspace = { path = "crates/markraft-workspace", default-features = false }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
# Rust's debug-info stripping can misalign proc-macro dylibs on macOS 27.
# Keep the linker output intact: rust-lang/rust#157750.
strip = "none"

[profile.release.build-override]
strip = "none"

# Xcode archives need Rust debug information for their matching dSYMs.
# Keep direct-distribution release artifacts on the existing release profile.
[profile.app-store]
inherits = "release"
debug = 1
split-debuginfo = "unpacked"
strip = "none"

# Run python3 scripts/prepare-dependencies.py before Cargo. See patches/README.md.
[patch.crates-io]
gpui-pre-macos = { path = ".build/dependencies/gpui-pre-macos" }
